services:
  # Backend FastAPI Service
  - type: web
    name: yukti-backend
    env: python
    rootDir: yukti-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        value: postgresql+psycopg2://postgres.uzezdwmeauuoxshqvqyf:tzAN2FrqvQCvLBR4@aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: FRONTEND_URL
        value: https://yukti-frontend.onrender.com  # This will be replaced by your actual frontend URL if different.
      - key: SECRET_KEY
        value: 0d44d58074e8309035ae3e94652d303d50f8c92e126def9b0e3c53b235710b1e
      
  # Frontend React (Vite) Service
  - type: web
    name: yukti-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # This tells the React app to talk to the Render backend service we just defined
        fromService:
          type: web
          name: yukti-backend
          envVarKey: RENDER_EXTERNAL_URL
