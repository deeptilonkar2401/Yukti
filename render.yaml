services:
  # Backend FastAPI Service
  - type: web
    name: yukti-backend
    env: python
    rootDir: yukti-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        value: sqlite:///./yukti_local.db  # Only for MVP. For production, switch to PostgreSQL.
      - key: FRONTEND_URL
        value: https://yukti-frontend.onrender.com  # This will be replaced by your actual frontend URL if different.
      - key: SECRET_KEY
        value: YOUR_SUPER_SECRET_KEY_HERE
      
  # Frontend React (Vite) Service
  - type: web
    name: yukti-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # This tells the React app to talk to the Render backend service we just defined
        fromService:
          type: web
          name: yukti-backend
          envVarKey: RENDER_EXTERNAL_URL
